# Runs the Unity EditMode tests on every PR and on every push to main, and reports them as a "Test Results" check.
# Needs the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets; see docs/ci.md.
name: Unity tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless, so cancel it.
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # lets the test runner publish the "Test Results" check

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          lfs: true

      # Unity's import cache. Without it every run re-imports all assets from scratch.
      - name: Restore the Library cache
        uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run the EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
